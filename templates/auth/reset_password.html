{% extends "auth_base.html" %}
{% block title %}Set a new password{% endblock %}
{% block auth_content %}
  <h1>Set a new password</h1>
  <p class="lede">Choose a new password for your account.</p>

  <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required autofocus autocomplete="new-password">
      <div class="hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update password</button>
  </form>

  <div class="auth-foot">
    <a href="{{ url_for('auth.login') }}">Back to log in</a>
  </div>
{% endblock %}
