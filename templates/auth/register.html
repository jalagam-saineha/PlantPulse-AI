{% extends "auth_base.html" %}
{% block title %}Create your account{% endblock %}
{% block auth_content %}
  <h1>Create your account</h1>
  <p class="lede">Start tracking plant health with real measurements, not guesses.</p>

  <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
      <div class="hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <div class="auth-foot">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </div>
{% endblock %}
