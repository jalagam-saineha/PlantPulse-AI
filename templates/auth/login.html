{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
  <h1>Welcome back</h1>
  <p class="lede">Log in to keep reading your plants.</p>

  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="row" style="justify-content: space-between; margin-bottom: 1.3rem;">
      <label class="checkbox-row">
        <input type="checkbox" name="remember" style="width:auto;">
        Remember me
      </label>
      <a class="text-sm" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <div class="auth-foot">
    New to PlantPulse? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </div>
{% endblock %}
