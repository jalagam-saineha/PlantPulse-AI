<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} — {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 2rem;">
    <div class="card" style="max-width: 440px; text-align:center;">
      <div class="empty-icon" style="margin:0 auto 1rem; background: var(--status-warning-bg); color: var(--status-warning);">
        {{ icon('alert-triangle', 24) }}
      </div>
      {% block error_content %}{% endblock %}
      <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="margin-top: 1.25rem;">Back to PlantPulse AI</a>
    </div>
  </div>
</body>
</html>
